[package]
name = "mist-core"
version = "0.2.0"
edition = "2021"
description = "Mist core — protocol, scripting, markup (no UI)"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
flate2 = "1"
bytes = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
directories = "5"
dirs = "5"
# Keychain (macOS), Credential Manager (Windows), Secret Service (Linux).
# The crate's default `v1` feature enables the native store for all three.
keyring = "4"
rodio = { version = "0.20", optional = true, default-features = false, features = ["wav", "mp3", "vorbis"] }
midly = { version = "0.5", optional = true }

[features]
default = []
sound = ["dep:rodio", "dep:midly"]
